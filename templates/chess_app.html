<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperPrompter AI - Play Chess</title>

    <!-- Bootstrap 4 & FontAwesome -->
    <link rel="stylesheet" href="[https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css](https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css)">
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css)">

    <!-- Chessboard.js CSS -->
    <link rel="stylesheet" href="[https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css](https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css)">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e293b; color: #f8fafc; }
        .main-card { border-radius: 12px; border: 1px solid #334155; background-color: #0f172a; }
        #myBoard { width: 440px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; }
        .commentary-box { background-color: #1e293b; border-left: 4px solid #f59e0b; padding: 15px; border-radius: 6px; min-height: 120px; font-size: 0.95rem; }
        .status-console { background-color: #020617; color: #38bdf8; font-family: monospace; padding: 10px 14px; border-radius: 6px; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="container my-4" style="max-width: 1050px;">
    <div class="card main-card shadow-lg">
        
        <div class="card-header bg-slate-900 border-bottom border-secondary py-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0 text-warning font-weight-bold">
                <i class="fas fa-chess mr-2"></i>SuperPrompter AI Chess
            </h4>
            <button class="btn btn-outline-light btn-sm" onclick="resetGame()">
                <i class="fas fa-redo mr-1"></i> New Game
            </button>
        </div>

        <div class="card-body">
            <div class="row">
                
                <!-- Chessboard Column -->
                <div class="col-md-6 text-center mb-4 mb-md-0">
                    <div id="myBoard"></div>
                    <div class="mt-3">
                        <span class="badge badge-secondary px-3 py-2" id="turnIndicator">Your Turn (White)</span>
                    </div>
                </div>

                <!-- Analysis & Commentary Column -->
                <div class="col-md-6">
                    <h5 class="font-weight-bold text-light mb-3"><i class="fas fa-robot text-warning mr-2"></i>AI Grandmaster Analysis</h5>
                    
                    <div class="commentary-box mb-3" id="commentaryContent">
                        <p class="text-muted mb-0 font-italic">Make your opening move as White to start the match...</p>
                    </div>

                    <div class="card bg-slate-900 border-secondary mb-3">
                        <div class="card-body py-2">
                            <small class="text-muted font-weight-bold">POSITION EVALUATION:</small>
                            <div id="evalText" class="font-weight-bold text-warning">+0.0 (Starting Position)</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div id="statusConsole" class="status-console">Game ready. Drag and drop any piece to move.</div>
                    </div>

                    <div class="card bg-slate-900 border-secondary">
                        <div class="card-header py-2 font-weight-bold text-muted small">MOVE HISTORY</div>
                        <div class="card-body py-2" id="moveHistory" style="max-height: 100px; overflow-y: auto; font-family: monospace; font-size: 0.85rem;">
                            1. ...
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Dependencies: jQuery, chess.js (Rules Engine), chessboard.js (Board UI) -->
<script src="[https://code.jquery.com/jquery-3.5.1.min.js](https://code.jquery.com/jquery-3.5.1.min.js)"></script>
<script src="[https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js](https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js)"></script>
<script src="[https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js](https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js)"></script>

<script>
    let board = null;
    const game = new Chess();
    const statusConsole = document.getElementById('statusConsole');

    function logStatus(msg) {
        statusConsole.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
    }

    function onDragStart(source, piece, position, orientation) {
        if (game.game_over()) return false;
        // User plays White: allow picking only white pieces on White's turn
        if (game.turn() !== 'w' || piece.search(/^b/) !== -1) return false;
    }

    function onDrop(source, target) {
        // Test move validity via chess.js
        const move = game.move({
            from: source,
            to: target,
            promotion: 'q' // Auto-promote to queen for simplicity
        });

        if (move === null) return 'snapback'; // Illegal move

        updateUI();
        window.setTimeout(triggerAIMove, 250);
    }

    function onSnapEnd() {
        board.position(game.fen());
    }

    async function triggerAIMove() {
        if (game.game_over()) return;

        document.getElementById('turnIndicator').innerText = "AI is thinking...";
        document.getElementById('turnIndicator').className = "badge badge-warning text-dark px-3 py-2";
        logStatus("SuperPrompter AI is evaluating positions and calculating counter-move...");

        try {
            const legalMoves = game.moves();

            const res = await fetch('/chess_ai_move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fen: game.fen(),
                    history: game.history(),
                    legal_moves: legalMoves
                })
            });

            const data = await res.json();

            if (data.status === 'success' && data.ai_move) {
                // Execute move in chess.js engine
                game.move(data.ai_move);
                board.position(game.fen());

                // Update commentary & evaluation
                document.getElementById('commentaryContent').innerHTML = `
                    <div class="font-weight-bold text-warning mb-1"><i class="fas fa-chess-knight mr-1"></i> AI Move: ${data.ai_move}</div>
                    <p class="mb-0 text-light">${data.commentary}</p>
                `;
                document.getElementById('evalText').innerText = data.evaluation;
                logStatus(`AI executed move: ${data.ai_move}`);
            } else {
                // Fallback to random legal move if API fails
                const moves = game.moves();
                const randomMove = moves[Math.floor(Math.random() * moves.length)];
                game.move(randomMove);
                board.position(game.fen());
                logStatus(`AI executed fallback move: ${randomMove}`);
            }
        } catch (err) {
            logStatus('Move evaluation failed: ' + err.message);
        }

        updateUI();
    }

    function updateUI() {
        // Update turn indicator
        if (game.game_over()) {
            if (game.in_checkmate()) {
                document.getElementById('turnIndicator').innerText = game.turn() === 'w' ? "Checkmate! Black Wins." : "Checkmate! You Win!";
                document.getElementById('turnIndicator').className = "badge badge-danger px-3 py-2";
            } else if (game.in_draw()) {
                document.getElementById('turnIndicator').innerText = "Game Drawn (Stalemate / Repetition)";
                document.getElementById('turnIndicator').className = "badge badge-info px-3 py-2";
            }
        } else {
            document.getElementById('turnIndicator').innerText = game.turn() === 'w' ? "Your Turn (White)" : "AI's Turn (Black)";
            document.getElementById('turnIndicator').className = game.turn() === 'w' ? "badge badge-success px-3 py-2" : "badge badge-warning text-dark px-3 py-2";
        }

        // Update history display
        document.getElementById('moveHistory').innerText = game.history().join('  ');
    }

    function resetGame() {
        game.reset();
        board.start();
        document.getElementById('commentaryContent').innerHTML = '<p class="text-muted mb-0 font-italic">New game started. Make your opening move as White...</p>';
        document.getElementById('evalText').innerText = "+0.0 (Starting Position)";
        document.getElementById('moveHistory').innerText = "1. ...";
        logStatus("Board reset. White to move.");
        updateUI();
    }

    // Initialize board on page load
    $(document).ready(function() {
        board = Chessboard('myBoard', {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            pieceTheme: '[https://chessboardjs.com/img/chesspieces/wikipedia/](https://chessboardjs.com/img/chesspieces/wikipedia/){piece}.png'
        });
    });
</script>
</body>
</html>
