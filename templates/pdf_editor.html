<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive PDF Editor - SuperPrompter SI</title>
    
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PDF.js & pdf-lib CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <style>
        :root {
            --bg-body: #0d121f;
            --card-bg: #121929;
            --border-color: #1e293b;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .editor-container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .toolbar-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-action {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-action:hover, .btn-action.active {
            background: var(--accent-blue);
            color: #000;
        }

        .btn-save {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: #fff !important;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: 700;
        }

        .canvas-wrapper {
            position: relative;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            display: inline-block;
        }

        #pdfCanvas {
            display: block;
        }

        /* Overlay text inputs */
        .text-overlay-input {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            border: 1px dashed #0284c7;
            color: #000;
            font-size: 14px;
            padding: 2px 4px;
            outline: none;
            resize: both;
        }
    </style>
</head>
<body>

<div class="editor-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="font-weight-bold mb-0">PDF Document Editor</h4>
        <span class="text-muted small">Edit text, mask errors, and save modified PDFs directly</span>
    </div>

    <!-- Toolbar -->
    <div class="toolbar-panel">
        <div class="d-flex align-items-center flex-wrap" style="gap: 8px;">
            <label class="btn-action mb-0">
                <i class="fa-solid fa-file-pdf mr-1 text-danger"></i> Upload PDF
                <input type="file" id="pdfFileInput" accept="application/pdf" style="display: none;" onchange="loadPdfFile(event)">
            </label>
            <button type="button" id="btnAddText" class="btn-action" onclick="toggleAddText()">
                <i class="fa-solid fa-font mr-1"></i> Add Text Box
            </button>
            <button type="button" id="btnWhiteout" class="btn-action" onclick="toggleWhiteout()">
                <i class="fa-solid fa-eraser mr-1"></i> White-Out / Erase
            </button>
        </div>

        <div class="d-flex align-items-center" style="gap: 12px;">
            <div id="pageNav" style="display: none;">
                <button class="btn-action px-2" onclick="changePage(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                <span id="pageIndicator" class="mx-2 small font-weight-bold">Page 1 / 1</span>
                <button class="btn-action px-2" onclick="changePage(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <button type="button" id="btnSavePdf" class="btn-save" onclick="exportModifiedPdf()">
                <i class="fa-solid fa-download mr-1"></i> Save & Download PDF
            </button>
        </div>
    </div>

    <!-- PDF Viewer / Workspace -->
    <div class="text-center">
        <div id="workspaceWrapper" class="canvas-wrapper" style="display: none;">
            <canvas id="pdfCanvas"></canvas>
            <div id="annotationsLayer"></div>
        </div>
        <div id="emptyPlaceholder" class="p-5 border border-secondary rounded text-muted">
            <i class="fa-solid fa-file-arrow-up fa-3x mb-3 text-info"></i>
            <p>Upload a PDF document to begin editing.</p>
        </div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let rawPdfBytes = null;
    let pdfDoc = null;
    let currentPage = 1;
    let currentScale = 1.3;
    let activeTool = null; // 'text' or 'whiteout'

    // Annotations tracked per page
    const annotationsByPage = {};

    async function loadPdfFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        rawPdfBytes = await file.arrayBuffer();
        pdfDoc = await pdfjsLib.getDocument({ data: rawPdfBytes }).promise;

        document.getElementById('emptyPlaceholder').style.display = 'none';
        document.getElementById('workspaceWrapper').style.display = 'inline-block';
        document.getElementById('pageNav').style.display = 'flex';

        currentPage = 1;
        renderCurrentPage();
    }

    async function renderCurrentPage() {
        const page = await pdfDoc.getPage(currentPage);
        const viewport = page.getViewport({ scale: currentScale });

        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        document.getElementById('workspaceWrapper').style.width = viewport.width + 'px';
        document.getElementById('workspaceWrapper').style.height = viewport.height + 'px';

        await page.render({ canvasContext: ctx, viewport: viewport }).promise;

        document.getElementById('pageIndicator').innerText = `Page ${currentPage} / ${pdfDoc.numPages}`;
        renderPageAnnotations();
    }

    function toggleAddText() {
        activeTool = activeTool === 'text' ? null : 'text';
        document.getElementById('btnAddText').classList.toggle('active', activeTool === 'text');
    }

    // Click canvas to drop an editable text box
    document.getElementById('workspaceWrapper').addEventListener('click', function(e) {
        if (activeTool !== 'text') return;

        const rect = this.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        createTextInput(x, y);
        toggleAddText();
    });

    function createTextInput(x, y, existingText = '') {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'text-overlay-input';
        input.value = existingText;
        input.style.left = x + 'px';
        input.style.top = y + 'px';
        input.placeholder = 'Type here...';

        document.getElementById('annotationsLayer').appendChild(input);
        input.focus();

        if (!annotationsByPage[currentPage]) annotationsByPage[currentPage] = [];
        annotationsByPage[currentPage].push({ el: input, x, y });
    }

    function renderPageAnnotations() {
        const layer = document.getElementById('annotationsLayer');
        layer.innerHTML = '';
        const list = annotationsByPage[currentPage] || [];
        list.forEach(item => layer.appendChild(item.el));
    }

    async function changePage(offset) {
        if (!pdfDoc) return;
        const target = currentPage + offset;
        if (target >= 1 && target <= pdfDoc.numPages) {
            currentPage = target;
            await renderCurrentPage();
        }
    }

    async function exportModifiedPdf() {
        if (!rawPdfBytes) {
            alert('Please load a PDF first.');
            return;
        }

        const { PDFDocument, rgb, StandardFonts } = PDFLib;
        const pdfDocModified = await PDFDocument.load(rawPdfBytes);
        const helveticaFont = await pdfDocModified.embedFont(StandardFonts.Helvetica);

        // Stamp added annotations onto corresponding pages
        for (const [pageIdxStr, items] of Object.entries(annotationsByPage)) {
            const pageNum = parseInt(pageIdxStr);
            const page = pdfDocModified.getPage(pageNum - 1);
            const { height: pdfHeight } = page.getSize();

            items.forEach(item => {
                const textVal = item.el.value.trim();
                if (!textVal) return;

                // Convert browser canvas pixels back to PDF points
                const pdfX = item.x / currentScale;
                const pdfY = pdfHeight - (item.y / currentScale) - 12;

                page.drawText(textVal, {
                    x: pdfX,
                    y: pdfY,
                    size: 11,
                    font: helveticaFont,
                    color: rgb(0, 0, 0),
                });
            });
        }

        const finalBytes = await pdfDocModified.save();
        const blob = new Blob([finalBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'edited_document.pdf';
        link.click();
    }
</script>
</body>
</html>
