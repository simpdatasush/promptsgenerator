<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Document Editor - SuperPrompter AI</title>
    
    <!-- Bootstrap 4, FontAwesome 6 & Typography -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- PDF.js & pdf-lib CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <style>
        :root {
            --bg-body: #0d121f;
            --card-bg: #121929;
            --border-color: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
        }

        .top-navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 10px 24px;
        }
        .ai-badge-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #007bff;
            color: #ffffff;
            font-weight: 700;
            font-size: 1rem;
            width: 34px;
            height: 34px;
            border-radius: 6px;
            margin-bottom: 2px;
        }
        .brand-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1f2937;
            letter-spacing: -0.5px;
            line-height: 1.1;
            margin-bottom: 2px;
        }
        .home-link {
            color: #007bff;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
        }

        .editor-container {
            max-width: 1160px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .toolbar-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-action {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 7px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-action:hover, .btn-action.active {
            background: var(--accent-blue);
            color: #000;
        }

        .btn-save {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: #fff !important;
            border: none;
            padding: 7px 18px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.88rem;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
            cursor: pointer;
        }
        .btn-save:hover {
            filter: brightness(1.1);
        }

        .canvas-wrapper {
            position: relative;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            display: inline-block;
            border-radius: 4px;
            overflow: visible;
        }

        #pdfCanvas {
            display: block;
            border-radius: 4px;
        }

        /* Draggable & Resizable Image Overlay */
        .image-overlay-box {
            position: absolute;
            border: 2px dashed #0284c7;
            cursor: move;
            user-select: none;
            background: rgba(255, 255, 255, 0.08);
            z-index: 10;
        }
        .image-overlay-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }
        .image-overlay-box .delete-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ef4444;
            color: #ffffff;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 20;
        }
        .image-overlay-box .resize-handle {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #0284c7;
            bottom: -7px;
            right: -7px;
            cursor: se-resize;
            border-radius: 3px;
            z-index: 20;
        }

        /* Overlay text inputs */
        .text-overlay-input {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border: 1px dashed #0284c7;
            color: #000;
            font-size: 13px;
            font-weight: 500;
            padding: 2px 6px;
            outline: none;
            border-radius: 3px;
            z-index: 15;
            min-width: 80px;
        }
        .text-overlay-input:focus {
            border: 1px solid #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .empty-zone {
            padding: 80px 20px;
            border: 2px dashed var(--border-color);
            background: var(--card-bg);
            border-radius: 12px;
            text-align: center;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

<header class="top-navbar">
    <div>
        <div class="ai-badge-logo">AI</div>
        <div class="brand-title">SuperPrompter</div>
        <a href="{{ url_for('landing') }}" class="home-link">Home</a>
    </div>
</header>

<div class="editor-container">
    <div class="mb-4">
        <h3 class="font-weight-bold mb-1">PDF Form &amp; Document Editor</h3>
        <p class="text-muted small mb-0">Upload documents, overlay phone photos &amp; signatures, correct text fields, and download the edited PDF directly.</p>
    </div>

    <!-- Workspace Controls -->
    <div class="toolbar-panel">
        <div class="d-flex align-items-center flex-wrap" style="gap: 8px;">
            <label class="btn-action mb-0">
                <i class="fa-solid fa-file-pdf mr-1 text-danger"></i> Open PDF
                <input type="file" id="pdfFileInput" accept="application/pdf" style="display: none;" onchange="loadPdfFile(event)">
            </label>

            <label class="btn-action mb-0" id="btnInsertImage" style="display: none;">
                <i class="fa-solid fa-camera mr-1 text-success"></i> Add Photo / Sign
                <input type="file" id="imageFileInput" accept="image/jpeg,image/png" style="display: none;" onchange="handleImageInsert(event)">
            </label>

            <button type="button" id="btnAddText" class="btn-action" style="display: none;" onclick="toggleAddText()">
                <i class="fa-solid fa-font mr-1"></i> Add Text
            </button>
        </div>

        <div class="d-flex align-items-center flex-wrap" style="gap: 12px;">
            <div id="pageNav" style="display: none; align-items: center;">
                <button class="btn-action px-2 py-1" onclick="changePage(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                <span id="pageIndicator" class="mx-2 small font-weight-bold text-muted">Page 1 / 1</span>
                <button class="btn-action px-2 py-1" onclick="changePage(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>

            <button type="button" id="btnSavePdf" class="btn-save" style="display: none;" onclick="exportModifiedPdf()">
                <i class="fa-solid fa-download mr-1"></i> Save &amp; Download PDF
            </button>
        </div>
    </div>

    <!-- Active Stage -->
    <div class="text-center">
        <div id="workspaceWrapper" class="canvas-wrapper" style="display: none;">
            <canvas id="pdfCanvas"></canvas>
            <div id="annotationsLayer"></div>
        </div>

        <div id="emptyPlaceholder" class="empty-zone">
            <i class="fa-solid fa-file-arrow-up fa-3x mb-3 text-info"></i>
            <h6 class="font-weight-bold text-white mb-1">No PDF Loaded</h6>
            <p class="small mb-0">Select an application form, hall ticket, or document to start editing.</p>
        </div>
    </div>
</div>

<script>
    // Initialize PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let rawPdfBytes = null;
    let pdfDoc = null;
    let currentPage = 1;
    let currentScale = 1.35;
    let activeTool = null; // 'text'

    // Multi-page overlay stores
    const textAnnotationsByPage = {};
    const imageAnnotationsByPage = {};

    // ----------------------------------------------------
    // PDF INGESTION & MASTER BUFFER PROTECTION
    // ----------------------------------------------------
    async function loadPdfFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        try {
            const buffer = await file.arrayBuffer();
            // Retain an untouched binary copy for pdf-lib export
            rawPdfBytes = buffer.slice(0);

            // Pass a decoupled copy to the pdf.js worker thread
            pdfDoc = await pdfjsLib.getDocument({ data: buffer.slice(0) }).promise;

            document.getElementById('emptyPlaceholder').style.display = 'none';
            document.getElementById('workspaceWrapper').style.display = 'inline-block';
            document.getElementById('btnInsertImage').style.display = 'inline-block';
            document.getElementById('btnAddText').style.display = 'inline-block';
            document.getElementById('btnSavePdf').style.display = 'inline-block';
            document.getElementById('pageNav').style.display = 'flex';

            currentPage = 1;
            await renderCurrentPage();
        } catch (err) {
            console.error("PDF load failure:", err);
            alert("Error loading PDF: " + err.message);
        }
    }

    async function renderCurrentPage() {
        if (!pdfDoc) return;
        const page = await pdfDoc.getPage(currentPage);
        const viewport = page.getViewport({ scale: currentScale });

        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        const wrapper = document.getElementById('workspaceWrapper');
        wrapper.style.width = viewport.width + 'px';
        wrapper.style.height = viewport.height + 'px';

        await page.render({ canvasContext: ctx, viewport: viewport }).promise;

        document.getElementById('pageIndicator').innerText = `Page ${currentPage} / ${pdfDoc.numPages}`;
        renderPageOverlays();
    }

    // ----------------------------------------------------
    // IMAGE & SIGNATURE INSERTION
    // ----------------------------------------------------
    async function handleImageInsert(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            const dataUrl = e.target.result;
            const arrayBuf = await file.arrayBuffer();
            const rawBytes = new Uint8Array(arrayBuf);
            const isPng = file.type === 'image/png' || file.name.toLowerCase().endsWith('.png');

            createImageOverlay(dataUrl, rawBytes, isPng, 40, 40, 150, 110);
            event.target.value = ''; // Reset input to permit subsequent uploads of identical files
        };
        reader.readAsDataURL(file);
    }

    function createImageOverlay(dataUrl, rawBytes, isPng, x, y, w, h) {
        const wrapper = document.getElementById('annotationsLayer');

        const box = document.createElement('div');
        box.className = 'image-overlay-box';
        box.style.left = x + 'px';
        box.style.top = y + 'px';
        box.style.width = w + 'px';
        box.style.height = h + 'px';

        const img = document.createElement('img');
        img.src = dataUrl;
        box.appendChild(img);

        // Delete button
        const delBtn = document.createElement('div');
        delBtn.className = 'delete-btn';
        delBtn.innerHTML = '&times;';
        delBtn.onclick = (e) => {
            e.stopPropagation();
            box.remove();
            imageAnnotationsByPage[currentPage] = imageAnnotationsByPage[currentPage].filter(i => i.el !== box);
        };
        box.appendChild(delBtn);

        // Resize handle
        const resizeHandle = document.createElement('div');
        resizeHandle.className = 'resize-handle';
        box.appendChild(resizeHandle);

        wrapper.appendChild(box);

        const imgRecord = { el: box, rawBytes, isPng, x, y, w, h };
        if (!imageAnnotationsByPage[currentPage]) imageAnnotationsByPage[currentPage] = [];
        imageAnnotationsByPage[currentPage].push(imgRecord);

        // Dragging mechanics
        let isDragging = false, dragStartX = 0, dragStartY = 0;
        box.addEventListener('mousedown', (e) => {
            if (e.target === resizeHandle || e.target === delBtn) return;
            isDragging = true;
            dragStartX = e.clientX - box.offsetLeft;
            dragStartY = e.clientY - box.offsetTop;
            e.preventDefault();
        });

        // Resizing mechanics
        let isResizing = false, startW = 0, startH = 0, startMouseX = 0, startMouseY = 0;
        resizeHandle.addEventListener('mousedown', (e) => {
            isResizing = true;
            startW = box.offsetWidth;
            startH = box.offsetHeight;
            startMouseX = e.clientX;
            startMouseY = e.clientY;
            e.stopPropagation();
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const newX = Math.max(0, e.clientX - dragStartX);
                const newY = Math.max(0, e.clientY - dragStartY);
                box.style.left = newX + 'px';
                box.style.top = newY + 'px';
                imgRecord.x = newX;
                imgRecord.y = newY;
            } else if (isResizing) {
                const newW = Math.max(40, startW + (e.clientX - startMouseX));
                const newH = Math.max(25, startH + (e.clientY - startMouseY));
                box.style.width = newW + 'px';
                box.style.height = newH + 'px';
                imgRecord.w = newW;
                imgRecord.h = newH;
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            isResizing = false;
        });
    }

    // ----------------------------------------------------
    // TEXT OVERLAY MECHANICS
    // ----------------------------------------------------
    function toggleAddText() {
        activeTool = activeTool === 'text' ? null : 'text';
        document.getElementById('btnAddText').classList.toggle('active', activeTool === 'text');
    }

    document.getElementById('workspaceWrapper').addEventListener('click', function(e) {
        if (activeTool !== 'text') return;
        const rect = this.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        createTextInput(x, y);
        toggleAddText();
    });

    function createTextInput(x, y, existingText = '') {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'text-overlay-input';
        input.value = existingText;
        input.style.left = x + 'px';
        input.style.top = y + 'px';
        input.placeholder = 'Type here...';

        document.getElementById('annotationsLayer').appendChild(input);
        input.focus();

        if (!textAnnotationsByPage[currentPage]) textAnnotationsByPage[currentPage] = [];
        textAnnotationsByPage[currentPage].push({ el: input, x, y });
    }

    function renderPageOverlays() {
        const layer = document.getElementById('annotationsLayer');
        layer.innerHTML = '';

        // Re-attach text
        const textList = textAnnotationsByPage[currentPage] || [];
        textList.forEach(item => layer.appendChild(item.el));

        // Re-attach images
        const imgList = imageAnnotationsByPage[currentPage] || [];
        imgList.forEach(item => layer.appendChild(item.el));
    }

    async function changePage(offset) {
        if (!pdfDoc) return;
        const target = currentPage + offset;
        if (target >= 1 && target <= pdfDoc.numPages) {
            currentPage = target;
            await renderCurrentPage();
        }
    }

    // ----------------------------------------------------
    // ROBUST EXPORT ENGINE VIA PDF-LIB
    // ----------------------------------------------------
    async function exportModifiedPdf() {
        const saveBtn = document.getElementById('btnSavePdf');

        if (!rawPdfBytes || rawPdfBytes.byteLength === 0) {
            alert('Please load a PDF document first.');
            return;
        }

        const originalText = saveBtn.innerHTML;
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Saving...';

        try {
            const { PDFDocument, rgb, StandardFonts } = PDFLib;
            // Use the unmutated binary copy
            const pdfDocModified = await PDFDocument.load(rawPdfBytes.slice(0));
            const helveticaFont = await pdfDocModified.embedFont(StandardFonts.Helvetica);

            // 1. Process Embedded Images / Signatures per page
            for (const [pageIdxStr, items] of Object.entries(imageAnnotationsByPage)) {
                const pageNum = parseInt(pageIdxStr, 10);
                if (pageNum < 1 || pageNum > pdfDocModified.getPageCount()) continue;

                const page = pdfDocModified.getPage(pageNum - 1);
                const { height: pdfHeight } = page.getSize();

                for (const item of items) {
                    let embeddedImg;
                    try {
                        if (item.isPng) {
                            embeddedImg = await pdfDocModified.embedPng(item.rawBytes);
                        } else {
                            embeddedImg = await pdfDocModified.embedJpg(item.rawBytes);
                        }
                    } catch (mismatchErr) {
                        // Header fallback if JPEG had .png filename or vice versa
                        try {
                            embeddedImg = item.isPng
                                ? await pdfDocModified.embedJpg(item.rawBytes)
                                : await pdfDocModified.embedPng(item.rawBytes);
                        } catch (fatalErr) {
                            console.error("Could not embed image asset:", fatalErr);
                            continue;
                        }
                    }

                    // Convert CSS canvas pixels back to PDF points
                    const pdfX = item.x / currentScale;
                    const pdfW = item.w / currentScale;
                    const pdfH = item.h / currentScale;
                    const pdfY = pdfHeight - ((item.y + item.h) / currentScale);

                    page.drawImage(embeddedImg, {
                        x: pdfX,
                        y: pdfY,
                        width: pdfW,
                        height: pdfH,
                    });
                }
            }

            // 2. Process Text Inputs per page
            for (const [pageIdxStr, items] of Object.entries(textAnnotationsByPage)) {
                const pageNum = parseInt(pageIdxStr, 10);
                if (pageNum < 1 || pageNum > pdfDocModified.getPageCount()) continue;

                const page = pdfDocModified.getPage(pageNum - 1);
                const { height: pdfHeight } = page.getSize();

                items.forEach(item => {
                    const textVal = item.el.value ? item.el.value.trim() : '';
                    if (!textVal) return;

                    const pdfX = item.x / currentScale;
                    const pdfY = pdfHeight - (item.y / currentScale) - 12;

                    page.drawText(textVal, {
                        x: pdfX,
                        y: pdfY,
                        size: 11,
                        font: helveticaFont,
                        color: rgb(0, 0, 0),
                    });
                });
            }

            // 3. Serialize & trigger browser file download
            const finalPdfBytes = await pdfDocModified.save();
            const blob = new Blob([finalPdfBytes], { type: 'application/pdf' });
            const downloadUrl = window.URL.createObjectURL(blob);

            const downloadLink = document.createElement('a');
            downloadLink.href = downloadUrl;
            downloadLink.download = 'edited_document.pdf';
            document.body.appendChild(downloadLink);
            downloadLink.click();

            setTimeout(() => {
                document.body.removeChild(downloadLink);
                window.URL.revokeObjectURL(downloadUrl);
                saveBtn.disabled = false;
                saveBtn.innerHTML = originalText;
            }, 200);

        } catch (err) {
            console.error("PDF Export failed:", err);
            alert("Export error: " + err.message);
            saveBtn.disabled = false;
            saveBtn.innerHTML = originalText;
        }
    }
</script>
</body>
</html>
