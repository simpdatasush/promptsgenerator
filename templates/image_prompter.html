<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperPrompter AI - Image Prompt Architect</title>
    
    <!-- Bootstrap 4, FontAwesome & Typography -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-canvas: #090d16;
            --surface-card: #111827;
            --surface-secondary: #1e293b;
            --border-subtle: #2d3748;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-cyan: #38bdf8;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-code: 'Fira Code', monospace;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(168, 85, 247, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .main-shell {
            background-color: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }

        .shell-header {
            padding: 24px 30px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-tag {
            background: rgba(168, 85, 247, 0.1);
            color: var(--accent-purple);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 9999px;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .section-label {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .preset-chip {
            background: var(--surface-secondary);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            padding: 7px 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 0 6px 8px 0;
            display: inline-flex;
            align-items: center;
        }

        .preset-chip:hover {
            color: var(--text-primary);
            border-color: var(--accent-purple);
            background: rgba(168, 85, 247, 0.08);
            transform: translateY(-1px);
        }

        .input-dark {
            background-color: #0b1120 !important;
            border: 1px solid var(--border-subtle) !important;
            color: var(--text-primary) !important;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .input-dark:focus {
            border-color: var(--accent-purple) !important;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2) !important;
        }

        .btn-generate {
            background: linear-gradient(135deg, #9333ea 0%, #db2777 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 13px 20px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(219, 39, 119, 0.3);
            transition: all 0.2s ease;
        }

        .btn-generate:hover {
            background: linear-gradient(135deg, #7e22ce 0%, #be185d 100%);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .terminal-status {
            background: #060a12;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 12px 18px;
            font-family: var(--font-code);
            font-size: 0.85rem;
            color: #c084fc;
        }

        .prompt-output-box {
            background-color: #060a12;
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            padding: 24px 20px 20px 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            line-height: 1.7;
            color: #f1f5f9;
        }

        .btn-copy {
            position: absolute;
            top: 12px;
            right: 14px;
            background: var(--surface-secondary);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 5px 12px;
            transition: all 0.2s;
        }

        .btn-copy:hover {
            color: #ffffff;
            background: #334155;
            border-color: #475569;
        }
    </style>
</head>
<body>

<div class="container py-5" style="max-width: 1000px;">
    <div class="main-shell">
        
        <!-- Header -->
        <div class="shell-header">
            <div>
                <h4 class="mb-1 font-weight-bold d-flex align-items-center" style="letter-spacing: -0.5px;">
                    <i class="fa-solid fa-palette text-purple mr-3" style="color: #c084fc;"></i>Image Prompt Architect
                </h4>
                <div class="text-muted small">Transforms simple concepts into ultra-detailed, cinematic text prompts</div>
            </div>
            <span class="badge-tag"><i class="fa-solid fa-camera-retro mr-1"></i> Midjourney / FLUX / Imagen Ready</span>
        </div>

        <div class="p-4 p-md-5">
            
            <!-- Quick Example Concepts -->
            <div class="mb-4">
                <div class="section-label mb-2">Example Visual Concepts</div>
                <div class="d-flex flex-wrap">
                    <button class="preset-chip" onclick="setExample('An ancient cyberpunk monk meditating atop a Tokyo skyscraper in rain', 'Cyberpunk / Sci-Fi')">
                        <i class="fa-solid fa-cloud-moon mr-2 text-info"></i>Cyberpunk Monk
                    </button>
                    <button class="preset-chip" onclick="setExample('An elderly artisan craftsman carving wooden gears in a sunlit 19th-century workshop', 'Cinematic Photorealistic')">
                        <i class="fa-solid fa-sun mr-2 text-warning"></i>19th Century Artisan
                    </button>
                    <button class="preset-chip" onclick="setExample('A majestic bioluminescent underwater whale gliding through deep oceanic ruins', 'Surreal / Fantasy')">
                        <i class="fa-solid fa-water mr-2 text-primary"></i>Bioluminescent Whale
                    </button>
                    <button class="preset-chip" onclick="setExample('Minimalist architectural villa nestled on a foggy Nordic cliffside overlooking the sea', 'Architectural Photography')">
                        <i class="fa-solid fa-building mr-2 text-success"></i>Nordic Cliffside Villa
                    </button>
                </div>
            </div>

            <!-- Inputs -->
            <div class="form-row mb-4">
                <div class="form-group col-lg-8 mb-3 mb-lg-0">
                    <label class="section-label mb-2">Image Subject or Topic</label>
                    <textarea id="topicInput" class="form-control input-dark" rows="3" placeholder="Describe the image you want to create (e.g., A vintage 1970s rally car racing across muddy mountain terrain during sunset)..."></textarea>
                </div>
                <div class="form-group col-lg-4">
                    <label class="section-label mb-2">Aesthetic Style</label>
                    <select id="styleSelect" class="form-control input-dark" style="height: calc(1.5em + 1.6rem + 2px);">
                        <option value="Cinematic 35mm Film Photography" selected>Cinematic 35mm Film</option>
                        <option value="Ultra-Realistic 8k Portraiture">Hyperrealistic Portraiture</option>
                        <option value="Dark Fantasy & Surrealism">Dark Fantasy / Surrealism</option>
                        <option value="Cyberpunk Octane Render">Cyberpunk / Unreal Engine 5</option>
                        <option value="Editorial Fashion Photography">Editorial Fashion Magazine</option>
                        <option value="Vintage 1970s National Geographic">Vintage 1970s Kodachrome</option>
                    </select>
                </div>
            </div>

            <!-- Submit Button -->
            <button id="generateBtn" class="btn btn-generate btn-block mb-4" onclick="generateImagePrompt()">
                <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Synthesize Master Text Prompt
            </button>

            <!-- Status Terminal -->
            <div class="mb-4">
                <div id="statusConsole" class="terminal-status">
                    <i class="fa-solid fa-terminal mr-2"></i> Ready. Enter your image topic to generate a detailed text prompt.
                </div>
            </div>

            <!-- Generated Output Container -->
            <div id="resultsPanel" style="display: none;">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div class="section-label" style="color: #c084fc;">Generated Text Prompt</div>
                </div>

                <div class="prompt-output-box mb-3">
                    <button class="btn btn-copy" onclick="copyPromptText()">
                        <i class="fa-regular fa-copy mr-1"></i> <span id="copyBtnText">Copy Prompt</span>
                    </button>
                    <div id="promptOutput" style="white-space: pre-wrap; font-size: 0.98rem;"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script>
    function logStatus(msg) {
        document.getElementById('statusConsole').innerHTML = `<i class="fa-solid fa-terminal mr-2"></i> [${new Date().toLocaleTimeString()}] ${msg}`;
    }

    function setExample(topic, style) {
        document.getElementById('topicInput').value = topic;
        document.getElementById('styleSelect').value = style;
        generateImagePrompt();
    }

    async function generateImagePrompt() {
        const topic = document.getElementById('topicInput').value.trim();
        const style = document.getElementById('styleSelect').value;
        const generateBtn = document.getElementById('generateBtn');
        const resultsPanel = document.getElementById('resultsPanel');
        const promptOutput = document.getElementById('promptOutput');

        if (!topic) {
            logStatus('Please enter an image subject or topic first.');
            return;
        }

        generateBtn.disabled = true;
        generateBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Orchestrating 10-D Visual Framework...';
        logStatus('Synthesizing lighting, lens optics, composition, and color grading into text prompt...');

        try {
            const res = await fetch('/image_prompter_generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic: topic, style_preference: style })
            });

            const data = await res.json();

            if (data.status === 'success') {
                resultsPanel.style.display = 'block';

                // Format Markdown bolding and line breaks into clean HTML
                let formatted = data.prompt_output
                    .replace(/\*\*(.*?)\*\*/g, '<strong class="text-warning">$1</strong>')
                    .replace(/\n\n/g, '<br><br>')
                    .replace(/\n/g, '<br>');

                promptOutput.innerHTML = formatted;
                logStatus('Master text prompt synthesized successfully!');
                resultsPanel.scrollIntoView({ behavior: 'smooth' });
            } else {
                logStatus('Error: ' + data.error);
            }
        } catch (e) {
            logStatus('Connection Error: ' + e.message);
        } finally {
            generateBtn.disabled = false;
            generateBtn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Synthesize Master Text Prompt';
        }
    }

    function copyPromptText() {
        // Strip out HTML tags to copy pure text
        const tempEl = document.createElement('div');
        tempEl.innerHTML = document.getElementById('promptOutput').innerHTML;
        const textToCopy = tempEl.innerText;

        navigator.clipboard.writeText(textToCopy).then(() => {
            const btnText = document.getElementById('copyBtnText');
            btnText.innerText = 'Copied!';
            setTimeout(() => { btnText.innerText = 'Copy Prompt'; }, 2000);
            logStatus('Prompt copied to clipboard!');
        });
    }
</script>
</body>
</html>
