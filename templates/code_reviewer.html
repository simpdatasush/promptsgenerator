<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperPrompter AI - Code Reviewer & Architect</title>

    <!-- Bootstrap 4, FontAwesome 6 & Typography -->
    <link rel="stylesheet" href="[https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css](https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css)">
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
    <link rel="preconnect" href="[https://fonts.googleapis.com](https://fonts.googleapis.com)">
    <link rel="preconnect" href="[https://fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
    <link href="[https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap](https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap)" rel="stylesheet">

    <style>
        :root {
            --bg-canvas: #090d16;
            --surface-card: #111827;
            --surface-subtle: #1e293b;
            --border-subtle: #334155;
            --accent-cyan: #38bdf8;
            --accent-green: #22c55e;
            --accent-amber: #f59e0b;
            --accent-purple: #a855f7;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-code: 'Fira Code', monospace;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .main-shell {
            background-color: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }

        .shell-header {
            padding: 24px 30px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-hud {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 9999px;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .section-label {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .preset-chip {
            background: var(--surface-subtle);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            padding: 7px 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 0 6px 8px 0;
            display: inline-flex;
            align-items: center;
        }

        .preset-chip:hover {
            color: var(--text-primary);
            border-color: var(--accent-cyan);
            background: rgba(56, 189, 248, 0.08);
            transform: translateY(-1px);
        }

        .input-dark {
            background-color: #0b1120 !important;
            border: 1px solid var(--border-subtle) !important;
            color: var(--text-primary) !important;
            border-radius: 10px;
            font-family: var(--font-code);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .input-dark:focus {
            border-color: var(--accent-cyan) !important;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15) !important;
        }

        .btn-generate {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 14px 20px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
            transition: all 0.2s ease;
            position: relative;
            z-index: 10;
        }

        .btn-generate:hover {
            background: linear-gradient(135deg, #0369a1 0%, #1d4ed8 100%);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .terminal-status {
            background: #060a12;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 12px 18px;
            font-family: var(--font-code);
            font-size: 0.85rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
        }

        .code-display {
            background-color: #060a12;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 24px 20px 20px 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .code-display pre {
            font-family: var(--font-code);
            font-size: 0.95rem;
            color: #7dd3fc;
            line-height: 1.6;
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .btn-copy {
            position: absolute;
            top: 12px;
            right: 14px;
            background: var(--surface-subtle);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 5px 12px;
            transition: all 0.2s;
        }

        .btn-copy:hover {
            color: #ffffff;
            background: #334155;
        }

        .info-card {
            background: var(--surface-subtle);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 18px 20px;
        }

        .industry-callout {
            background: rgba(168, 85, 247, 0.08);
            border-left: 4px solid var(--accent-purple);
            border-radius: 0 10px 10px 0;
            padding: 18px 20px;
        }
    </style>
</head>
<body>

<div class="container py-5" style="max-width: 1040px;">
    <div class="main-shell">
        
        <!-- Header -->
        <div class="shell-header">
            <div>
                <h4 class="mb-1 font-weight-bold d-flex align-items-center">
                    <i class="fa-solid fa-code-compare text-info mr-3"></i>Code Reviewer & Architectural Insights
                </h4>
                <div class="text-muted small">Analyze code efficiency, generate optimized refactors, and explore real-world industry usage</div>
            </div>
            <span class="badge-hud"><i class="fa-solid fa-microchip mr-1"></i> Multi-Language Engine</span>
        </div>

        <div class="p-4 p-md-5">
            
            <!-- Quick Preset Snippets -->
            <div class="mb-4">
                <div class="section-label mb-2">Preset Code Patterns</div>
                <div class="d-flex flex-wrap">
