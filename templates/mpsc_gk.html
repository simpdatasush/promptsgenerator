<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperPrompter AI - MPSC GK Practice Engine</title>
    <link rel="stylesheet" href="[https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css](https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css)">
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css)">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, 'Nirmala UI', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .main-card { border-radius: 10px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.06); background: #ffffff; }
        .option-box { display: block; width: 100%; text-align: left; margin-bottom: 8px; border: 1px solid #cbd5e1; background: #ffffff; border-radius: 6px; padding: 10px 14px; font-size: 0.98rem; }
        .option-box.correct { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; font-weight: bold; }
        .explanation-box { background-color: #f0fdf4; border-left: 5px solid #22c55e; padding: 14px 16px; border-radius: 0 6px 6px 0; font-size: 0.95rem; }
        .topic-pill { cursor: pointer; border-radius: 20px; font-size: 0.85rem; }
        .status-console { background-color: #0f172a; color: #38bdf8; font-family: monospace; padding: 10px 14px; border-radius: 6px; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="container my-4" style="max-width: 950px;">
    <div class="card main-card">
        
        <!-- Header -->
        <div class="card-header bg-dark text-white py-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0">
                <i class="fas fa-graduation-cap text-warning mr-2"></i>MPSC GK प्रश्नसंच निर्मिती
            </h4>
            <span class="badge badge-warning text-dark font-weight-bold">महाराष्ट्र राज्य लोकसेवा परीक्षा</span>
        </div>

        <div class="card-body">
            
            <!-- Quick Topic Starters in Marathi -->
            <div class="mb-3">
                <small class="text-muted font-weight-bold d-block mb-2">महत्त्वाचे MPSC सराव विषय:</small>
                <button class="btn btn-outline-secondary btn-sm topic-pill mr-1 mb-1" onclick="setTopic('महाराष्ट्रातील समाजसुधारक: महात्मा फुले आणि राजर्षी शाहू महाराज')">समाजसुधारक</button>
                <button class="btn btn-outline-secondary btn-sm topic-pill mr-1 mb-1" onclick="setTopic('महाराष्ट्राची प्राकृतिक रचना आणि गोदावरी नदी प्रणाली')">प्राकृतिक रचना व नद्या</button>
                <button class="btn btn-outline-secondary btn-sm topic-pill mr-1 mb-1" onclick="setTopic('७३ वी व ७४ वी घटनादुरुस्ती आणि पंचायत राज व्यवस्था')">पंचायत राज</button>
                <button class="btn btn-outline-secondary btn-sm topic-pill mr-1 mb-1" onclick="setTopic('महाराष्ट्रातील १८५७ चा उठाव आणि प्रमुख नेतृत्व')">१८५७ चा उठाव</button>
                <button class="btn btn-outline-secondary btn-sm topic-pill mr-1 mb-1" onclick="setTopic('सह्याद्री पर्वत आणि प्रमुख घाट रस्ते')">घाट रस्ते व पर्वत</button>
            </div>

            <!-- Input Controls -->
            <div class="form-row align-items-end mb-3">
                <div class="form-group col-md-9 mb-0">
                    <label class="font-weight-bold">MPSC विषय किंवा कीवर्ड प्रविष्ट करा:</label>
                    <input type="text" id="topicInput" class="form-control" placeholder="उदा. सह्याद्रीतील घाट, राज्यपालांचे विशेषाधिकार, तापी नदी खोरे...">
                </div>
                <div class="form-group col-md-3 mb-0">
                    <button id="generateBtn" class="btn btn-warning btn-block font-weight-bold" onclick="generateMCQs()">
                        <i class="fas fa-cogs mr-1"></i> प्रश्न तयार करा
                    </button>
                </div>
            </div>

            <!-- Status Console -->
            <div class="mb-4">
                <div id="statusConsole" class="status-console">तयार आहे. MPSC प्रश्न तयार करण्यासाठी विषय प्रविष्ट करा...</div>
            </div>

            <hr>

            <!-- Questions Container -->
            <div id="mcqContainer"></div>

        </div>
    </div>
</div>

<script src="[https://code.jquery.com/jquery-3.5.1.min.js](https://code.jquery.com/jquery-3.5.1.min.js)"></script>
<script>
    function logStatus(msg) {
        document.getElementById('statusConsole').innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
    }

    function setTopic(text) {
        document.getElementById('topicInput').value = text;
        generateMCQs();
    }

    async function generateMCQs() {
        const topic = document.getElementById('topicInput').value.trim();
        const generateBtn = document.getElementById('generateBtn');
        const container = document.getElementById('mcqContainer');

        if (!topic) {
            logStatus('कृपया विषय प्रविष्ट करा.');
            return;
        }

        generateBtn.disabled = true;
        generateBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> प्रश्न तयार होत आहेत...';
        logStatus(`SuperPrompter AI "${topic}" या विषयावर MPSC दर्जाचे प्रश्न तयार करत आहे...`);
        container.innerHTML = '';

        try {
            const res = await fetch('/mpsc_gk_generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic: topic, count: 3 })
            });

            const data = await res.json();

            if (data.status === 'success' && data.mcqs) {
                renderQuestions(data.mcqs);
                logStatus(`"${data.topic}" या विषयावर ${data.mcqs.length} प्रश्न यशस्वीरित्या तयार झाले.`);
            } else {
                logStatus('त्रुटी: ' + data.error);
            }
        } catch (e) {
            logStatus('सर्व्हर त्रुटी: ' + e.message);
        } finally {
            generateBtn.disabled = false;
            generateBtn.innerHTML = '<i class="fas fa-cogs mr-1"></i> प्रश्न तयार करा';
        }
    }

    function renderQuestions(mcqs) {
        const container = document.getElementById('mcqContainer');
        container.innerHTML = '';

        mcqs.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'card mb-4 border shadow-sm';
            
            let optionsHtml = '';
            for (const [key, text] of Object.entries(q.options)) {
                const isCorrect = (key === q.correct_option);
                optionsHtml += `
                    <div class="option-box ${isCorrect ? 'correct' : ''}">
                        <strong>(${key})</strong> ${escapeHtml(text)}
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="card-header bg-light font-weight-bold">
                    प्रश्न ${idx + 1}. ${escapeHtml(q.question)}
                </div>
                <div class="card-body">
                    <div class="options-wrapper mb-3">
                        ${optionsHtml}
                    </div>
                    <div class="explanation-box mt-3">
                        <div class="font-weight-bold text-success mb-1">
                            <i class="fas fa-check-circle mr-1"></i> योग्य उत्तर: पर्याय (${q.correct_option})
                        </div>
                        <div class="text-secondary">
                            <strong>स्पष्टीकरण:</strong> ${escapeHtml(q.explanation)}
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function escapeHtml(text) {
        return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }
</script>
</body>
</html>
