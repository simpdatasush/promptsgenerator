<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperPrompter AI - Chemistry Entrance Exam Engine</title>
    
    <!-- Bootstrap 4, FontAwesome 6 & Typography -->
    <link rel="stylesheet" href="[https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css](https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css)">
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
    <link rel="preconnect" href="[https://fonts.googleapis.com](https://fonts.googleapis.com)">
    <link rel="preconnect" href="[https://fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
    <link href="[https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap](https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap)" rel="stylesheet">

    <style>
        :root {
            --bg-canvas: #090d16;
            --surface-card: #111827;
            --surface-subtle: #1e293b;
            --border-subtle: #334155;
            --accent-cyan: #38bdf8;
            --accent-green: #22c55e;
            --accent-amber: #f59e0b;
            --accent-purple: #a855f7;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-code: 'Fira Code', monospace;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .main-shell {
            background-color: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }

        .shell-header {
            padding: 24px 30px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-exam {
            background: rgba(168, 85, 247, 0.12);
            color: var(--accent-purple);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 9999px;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .section-label {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .preset-chip {
            background: var(--surface-subtle);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            padding: 7px 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 0 6px 8px 0;
            display: inline-flex;
            align-items: center;
        }

        .preset-chip:hover {
            color: var(--text-primary);
            border-color: var(--accent-cyan);
            background: rgba(56, 189, 248, 0.08);
            transform: translateY(-1px);
        }

        .input-dark {
            background-color: #0b1120 !important;
            border: 1px solid var(--border-subtle) !important;
            color: var(--text-primary) !important;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .input-dark:focus {
            border-color: var(--accent-cyan) !important;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15) !important;
        }

        .btn-generate {
            background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 13px 20px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.35);
            transition: all 0.2s ease;
        }

        .btn-generate:hover {
            background: linear-gradient(135deg, #6d28d9 0%, #1d4ed8 100%);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .terminal-status {
            background: #060a12;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 12px 18px;
            font-family: var(--font-code);
            font-size: 0.85rem;
            color: #38bdf8;
        }

        .question-card {
            background: #0d1527;
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            margin-bottom: 24px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .question-header {
            background: #141e33;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-box {
            display: block;
            width: 100%;
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            color: #cbd5e1;
            padding: 11px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            text-align: left;
            font-size: 0.95rem;
        }

        .option-box.correct-choice {
            background: rgba(34, 197, 94, 0.12) !important;
            border-color: var(--accent-green) !important;
            color: #86efac !important;
            font-weight: 600;
        }

        .explanation-tray {
            background: #060a12;
            border-top: 1px solid var(--border-subtle);
            border-left: 4px solid var(--accent-green);
            padding: 16px 20px;
        }
    </style>
</head>
<body>

<div class="container py-5" style="max-width: 1040px;">
    <div class="main-shell">
        
        <!-- Header -->
        <div class="shell-header">
            <div>
                <h4 class="mb-1 font-weight-bold d-flex align-items-center">
                    <i class="fa-solid fa-atom text-warning mr-3"></i>Chemistry Entrance Exam Architecture
                </h4>
                <div class="text-muted small">MHT-CET • NEET (UG) • JEE Main • JEE Advanced</div>
            </div>
            <span class="badge-exam"><i class="fa-solid fa-graduation-cap mr-1"></i> CET / NEET / JEE</span>
        </div>

        <div class="p-4 p-md-5">
            
            <!-- Quick Preset Topics across Exams -->
            <div class="mb-4">
                <div class="section-label mb-2">High-Yield Exam Scenarios</div>
                <div class="d-flex flex-wrap">
                    <button class="preset-chip" onclick="setPreset('MHT-CET', 'Medium', 'Solutions: Colligative properties & Raoults law calculations')">
                        <i class="fa-solid fa-vial mr-2 text-warning"></i>CET: Raoult's Law (Medium)
                    </button>
                    <button class="preset-chip" onclick="setPreset('NEET (UG)', 'Medium', 'Coordination Compounds: Werner theory, isomerism & CFT electronic configurations')">
                        <i class="fa-solid fa-dna mr-2 text-info"></i>NEET: Coordination (Medium)
                    </button>
                    <button class="preset-chip" onclick="setPreset('JEE Main', 'High', 'Thermodynamics: Reversible adiabatic expansion work & Hess law cycles')">
                        <i class="fa-solid fa-fire-flame-curved mr-2 text-primary"></i>JEE Main: Thermo (High)
                    </button>
                    <button class="preset-chip" onclick="setPreset('JEE Advanced', 'High', 'Aldehydes & Ketones: Stereoselective nucleophilic addition & Aldol retro-synthesis')">
                        <i class="fa-solid fa-bolt mr-2 text-purple" style="color: #c084fc;"></i>JEE Adv: Organic Cascades (High)
                    </button>
                </div>
            </div>

            <!-- Inputs Grid: Topic, Exam, Difficulty, Count -->
            <div class="form-row mb-4">
                <div class="form-group col-lg-5 mb-3 mb-lg-0">
                    <label class="section-label mb-2">Chemistry Chapter / Sub-Topic</label>
                    <textarea id="topicInput" class="form-control input-dark" rows="3" placeholder="e.g., Electrochemistry: Nernst equation calculations, Gibbs free energy relation..."></textarea>
                </div>
                <div class="form-group col-lg-3 col-6">
                    <label class="section-label mb-2">Target Exam</label>
                    <select id="examSelect" class="form-control input-dark" style="height: calc(1.5em + 1.6rem + 2px);">
                        <option value="MHT-CET">MHT-CET (HSC Board)</option>
                        <option value="NEET (UG)">NEET (UG) (NCERT)</option>
                        <option value="JEE Main" selected>JEE Main (NTA Standard)</option>
                        <option value="JEE Advanced">JEE Advanced (IIT Standard)</option>
                    </select>
                </div>
                <div class="form-group col-lg-2 col-6">
                    <label class="section-label mb-2">Difficulty</label>
                    <select id="diffSelect" class="form-control input-dark" style="height: calc(1.5em + 1.6rem + 2px);">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div class="form-group col-lg-2 col-12">
                    <label class="section-label mb-2">Count</label>
                    <select id="countSelect" class="form-control input-dark" style="height: calc(1.5em + 1.6rem + 2px);">
                        <option value="3" selected>3 MCQs</option>
                        <option value="5">5 MCQs</option>
                    </select>
                </div>
            </div>

            <!-- Submit Button -->
            <button id="generateBtn" class="btn btn-generate btn-block mb-4" onclick="generateChemistryMCQs()">
                <i class="fa-solid fa-cogs mr-2"></i> Assemble Exam-Standard MCQs
            </button>

            <!-- Status Terminal -->
            <div class="mb-4">
                <div id="statusConsole" class="terminal-status">
                    <i class="fa-solid fa-terminal mr-2"></i> Ready. Select exam target and difficulty to synthesize question sets.
                </div>
            </div>

            <hr class="border-secondary mb-4">

            <!-- Container for Question Cards -->
            <div id="questionsContainer"></div>

        </div>
    </div>
</div>

<script src="[https://code.jquery.com/jquery-3.5.1.min.js](https://code.jquery.com/jquery-3.5.1.min.js)"></script>
<script>
    function logStatus(msg) {
        document.getElementById('statusConsole').innerHTML = `<i class="fa-solid fa-terminal mr-2"></i> [${new Date().toLocaleTimeString()}] ${msg}`;
    }

    function setPreset(exam, diff, topic) {
        document.getElementById('examSelect').value = exam;
        document.getElementById('diffSelect').value = diff;
        document.getElementById('topicInput').value = topic;
        generateChemistryMCQs();
    }

    async function generateChemistryMCQs() {
        const topic = document.getElementById('topicInput').value.trim();
        const exam = document.getElementById('examSelect').value;
        const difficulty = document.getElementById('diffSelect').value;
        const count = document.getElementById('countSelect').value;
        const generateBtn = document.getElementById('generateBtn');
        const container = document.getElementById('questionsContainer');

        if (!topic) {
            logStatus('Please enter a chemistry topic first.');
            return;
        }

        generateBtn.disabled = true;
        generateBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Synthesizing Question Set...';
        logStatus(`Formulating ${count} ${exam} questions [Difficulty: ${difficulty}] on "${topic}"...`);
        container.innerHTML = '';

        try {
            const res = await fetch('/chem_engine_generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    topic: topic,
                    exam: exam,
                    difficulty: difficulty,
                    count: parseInt(count)
                })
            });

            const data = await res.json();

            if (data.status === 'success' && data.mcqs) {
                renderQuestions(data.mcqs, data.exam, data.difficulty);
                logStatus(`Loaded ${data.mcqs.length} ${data.exam} questions successfully (${data.difficulty} Level).`);
                container.scrollIntoView({ behavior: 'smooth' });
            } else {
                logStatus('Error: ' + data.error);
            }
        } catch (e) {
            logStatus('Connection Error: ' + e.message);
        } finally {
            generateBtn.disabled = false;
            generateBtn.innerHTML = '<i class="fa-solid fa-cogs mr-2"></i> Assemble Exam-Standard MCQs';
        }
    }

    function renderQuestions(mcqs, examName, difficulty) {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';

        mcqs.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';

            let optionsHtml = '';
            for (const [key, text] of Object.entries(q.options)) {
                const isCorrect = (key === q.correct_option);
                optionsHtml += `
                    <div class="option-box ${isCorrect ? 'correct-choice' : ''}">
                        <strong class="mr-1">(${key})</strong> ${escapeHtml(text)}
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="question-header">
                    <span class="font-weight-bold text-light">
                        <i class="fa-solid fa-circle-question text-warning mr-2"></i>Question ${idx + 1}
                    </span>
                    <div>
                        <span class="badge badge-secondary mr-1">${escapeHtml(q.question_type || 'Single Correct')}</span>
                        <span class="badge ${difficulty === 'High' ? 'badge-danger' : (difficulty === 'Medium' ? 'badge-warning' : 'badge-success')}">${difficulty}</span>
                    </div>
                </div>
                <div class="p-3 p-md-4">
                    <div class="font-weight-bold mb-3 text-white" style="font-size: 1.02rem; line-height: 1.6;">
                        ${escapeHtml(q.question)}
                    </div>
                    
                    <div class="mb-3">
                        ${optionsHtml}
                    </div>

                    <!-- Answer and Solution Box -->
                    <div class="explanation-tray rounded">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="font-weight-bold text-success">
                                <i class="fa-solid fa-circle-check mr-1"></i> Correct Answer: Option (${q.correct_option})
                            </span>
                            <small class="text-muted"><i class="fa-solid fa-book-bookmark mr-1"></i>${escapeHtml(q.exam_source_pattern || examName)}</small>
                        </div>
                        <div class="small text-light" style="line-height: 1.6;">
                            <strong>Detailed Solution / Mechanism:</strong> ${escapeHtml(q.explanation)}
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function escapeHtml(text) {
        return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }
</script>
</body>
</html>
