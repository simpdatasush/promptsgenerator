<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — AI Pulse Daily Curator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0d1117; color: #e6edf3; padding-bottom: 90px; }
    .step-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; margin-bottom: 1.5rem; }
    .step-badge { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 700; font-size: 0.85rem; }
    .sticky-publish-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 1030;
      background: rgba(22, 27, 34, 0.95); backdrop-filter: blur(8px);
      border-top: 1px solid #30363d; padding: 14px 24px;
    }
  </style>
</head>
<body>
<div class="container py-4" style="max-width: 960px;">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
    <div>
      <h3 class="mb-1">AI Pulse — Daily Landing Page Curator</h3>
      <small class="text-secondary">
        Last published: <strong id="lastPublishedLabel">{{ pulse.published_at or 'Never published yet' }}</strong>
      </small>
    </div>
    <div class="d-flex gap-2">
      <button id="runAllBtn" class="btn btn-outline-info btn-sm" onclick="runAllStepsSequentially()">
        ▶ Run All 4 Steps in Sequence
      </button>
      <a href="{{ url_for('landing') }}" target="_blank" class="btn btn-outline-secondary btn-sm">View Landing Page ↗</a>
    </div>
  </div>

  <!-- STEP 1: AI STOCK TICKERS -->
  <div class="card step-card">
    <div class="card-header d-flex justify-content-between align-items-center border-secondary-subtle">
      <div class="d-flex align-items-center gap-2">
        <span class="step-badge bg-primary text-white">1</span>
        <h5 class="mb-0">AI Company Stock Tickers</h5>
      </div>
      <div class="d-flex gap-2 align-items-center">
        <input type="text" id="tickerSymbolsInput" class="form-control form-control-sm" style="width: 240px;"
               value="AMD, NVDA, GOOGL, META, MSFT" placeholder="Comma-separated symbols">
        <button id="btnStep1" class="btn btn-primary btn-sm" onclick="runStep1()">Fetch Tickers</button>
      </div>
    </div>
    <div class="card-body">
      <div id="tickersContainer" class="row g-2"></div>
    </div>
  </div>

  <!-- STEP 2: UPCOMING AI / TECH EVENTS -->
  <div class="card step-card">
    <div class="card-header d-flex justify-content-between align-items-center border-secondary-subtle">
      <div class="d-flex align-items-center gap-2">
        <span class="step-badge bg-primary text-white">2</span>
        <h5 class="mb-0">Upcoming AI / Tech Events</h5>
      </div>
      <button id="btnStep2" class="btn btn-primary btn-sm" onclick="runStep2()">Fetch Events</button>
    </div>
    <div class="card-body" id="eventsContainer"></div>
  </div>

  <!-- STEP 3: SPOTLIGHT AI / TECH REPOSITORY -->
  <div class="card step-card">
    <div class="card-header d-flex justify-content-between align-items-center border-secondary-subtle">
      <div class="d-flex align-items-center gap-2">
        <span class="step-badge bg-primary text-white">3</span>
        <h5 class="mb-0">Spotlight AI / Tech Repository</h5>
      </div>
      <button id="btnStep3" class="btn btn-primary btn-sm" onclick="runStep3()">Fetch Repo</button>
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-5">
          <label class="form-label small text-secondary">Repository (owner/repo)</label>
          <input type="text" id="repoName" class="form-control form-control-sm" value="{{ pulse.spotlight_repo.repo_name if pulse.spotlight_repo else '' }}">
        </div>
        <div class="col-md-2">
          <label class="form-label small text-secondary">Stars</label>
          <input type="text" id="repoStars" class="form-control form-control-sm" value="{{ pulse.spotlight_repo.stars if pulse.spotlight_repo else '' }}">
        </div>
        <div class="col-md-5">
          <label class="form-label small text-secondary">GitHub URL</label>
          <input type="url" id="repoUrl" class="form-control form-control-sm" value="{{ pulse.spotlight_repo.url if pulse.spotlight_repo else '' }}">
        </div>
        <div class="col-12">
          <label class="form-label small text-secondary">Summary</label>
          <textarea id="repoSummary" rows="2" class="form-control form-control-sm">{{ pulse.spotlight_repo.summary if pulse.spotlight_repo else '' }}</textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- STEP 4: SPOTLIGHT ARXIV PAPER -->
  <div class="card step-card">
    <div class="card-header d-flex justify-content-between align-items-center border-secondary-subtle">
      <div class="d-flex align-items-center gap-2">
        <span class="step-badge bg-primary text-white">4</span>
        <h5 class="mb-0">Spotlight arXiv Paper</h5>
      </div>
      <button id="btnStep4" class="btn btn-primary btn-sm" onclick="runStep4()">Fetch Paper</button>
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label small text-secondary">Paper Title</label>
          <input type="text" id="arxivTitle" class="form-control form-control-sm" value="{{ pulse.spotlight_arxiv.title if pulse.spotlight_arxiv else '' }}">
        </div>
        <div class="col-md-2">
          <label class="form-label small text-secondary">arXiv ID</label>
          <input type="text" id="arxivId" class="form-control form-control-sm" value="{{ pulse.spotlight_arxiv.arxiv_id if pulse.spotlight_arxiv else '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label small text-secondary">arXiv URL</label>
          <input type="url" id="arxivUrl" class="form-control form-control-sm" value="{{ pulse.spotlight_arxiv.url if pulse.spotlight_arxiv else '' }}">
        </div>
        <div class="col-12">
          <label class="form-label small text-secondary">Plain-English TL;DR</label>
          <textarea id="arxivTldr" rows="2" class="form-control form-control-sm">{{ pulse.spotlight_arxiv.tldr if pulse.spotlight_arxiv else '' }}</textarea>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- STICKY PUBLISH BAR -->
<div class="sticky-publish-bar">
  <div class="container d-flex justify-content-between align-items-center" style="max-width: 960px;">
    <span id="statusMessage" class="small text-secondary">Review the fields above, edit if needed, then push live.</span>
    <button id="publishBtn" class="btn btn-success fw-semibold px-4" onclick="sendToLanding()">
      🚀 Send to Landing
    </button>
  </div>
</div>

<script>
  const initialPulse = {{ pulse | tojson | safe }};

  function setBtnLoading(btnId, isLoading, defaultText) {
    const btn = document.getElementById(btnId);
    btn.disabled = isLoading;
    btn.innerHTML = isLoading
      ? `<span class="spinner-border spinner-border-sm me-1"></span>Fetching...`
      : defaultText;
  }

  function renderTickers(tickers = []) {
    const container = document.getElementById("tickersContainer");
    if (!tickers.length) {
      container.innerHTML = `<div class="text-secondary small">No tickers loaded yet. Click "Fetch Tickers".</div>`;
      return;
    }
    container.innerHTML = tickers.map(t => `
      <div class="col-md-4 col-sm-6 ticker-row">
        <div class="p-2 border border-secondary-subtle rounded bg-dark">
          <div class="d-flex gap-1 mb-1">
            <input type="text" class="form-control form-control-sm fw-bold ticker-symbol" value="${t.symbol || ''}" placeholder="Symbol">
            <input type="text" class="form-control form-control-sm ticker-price" value="${t.price || ''}" placeholder="$0.00">
            <input type="text" class="form-control form-control-sm ticker-change" value="${t.change_percent || ''}" placeholder="+0.00%">
          </div>
        </div>
      </div>
    `).join("");
  }

  function renderEvents(events = []) {
    const container = document.getElementById("eventsContainer");
    if (!events.length) {
      container.innerHTML = `<div class="text-secondary small">No events loaded yet. Click "Fetch Events".</div>`;
      return;
    }
    container.innerHTML = events.map(ev => `
      <div class="row g-2 mb-2 pb-2 border-bottom border-secondary-subtle event-row align-items-center">
        <div class="col-md-4"><input type="text" class="form-control form-control-sm event-name" value="${ev.name || ''}" placeholder="Event Name"></div>
        <div class="col-md-2"><input type="text" class="form-control form-control-sm event-date" value="${ev.date || ''}" placeholder="Date"></div>
        <div class="col-md-2"><input type="text" class="form-control form-control-sm event-location" value="${ev.location || ''}" placeholder="Location"></div>
        <div class="col-md-3"><input type="url" class="form-control form-control-sm event-url" value="${ev.url || ''}" placeholder="https://..."></div>
        <div class="col-md-1 text-end"><button class="btn btn-outline-danger btn-sm" onclick="this.closest('.event-row').remove()">×</button></div>
      </div>
    `).join("");
  }

  async function runStep1() {
    setBtnLoading("btnStep1", true, "Fetch Tickers");
    try {
      const symbols = document.getElementById("tickerSymbolsInput").value;
      const res = await fetch("/api/admin/pulse/step/tickers", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ symbols })
      });
      const json = await res.json();
      if (json.status === "success") renderTickers(json.data.tickers || []);
      else alert("Step 1 Error: " + json.error);
    } finally {
      setBtnLoading("btnStep1", false, "Fetch Tickers");
    }
  }

  async function runStep2() {
    setBtnLoading("btnStep2", true, "Fetch Events");
    try {
      const res = await fetch("/api/admin/pulse/step/events", { method: "POST" });
      const json = await res.json();
      if (json.status === "success") renderEvents(json.data.events || []);
      else alert("Step 2 Error: " + json.error);
    } finally {
      setBtnLoading("btnStep2", false, "Fetch Events");
    }
  }

  async function runStep3() {
    setBtnLoading("btnStep3", true, "Fetch Repo");
    try {
      const res = await fetch("/api/admin/pulse/step/repo", { method: "POST" });
      const json = await res.json();
      if (json.status === "success") {
        document.getElementById("repoName").value = json.data.repo_name || "";
        document.getElementById("repoStars").value = json.data.stars || "";
        document.getElementById("repoUrl").value = json.data.url || "";
        document.getElementById("repoSummary").value = json.data.summary || "";
      } else alert("Step 3 Error: " + json.error);
    } finally {
      setBtnLoading("btnStep3", false, "Fetch Repo");
    }
  }

  async function runStep4() {
    setBtnLoading("btnStep4", true, "Fetch Paper");
    try {
      const res = await fetch("/api/admin/pulse/step/arxiv", { method: "POST" });
      const json = await res.json();
      if (json.status === "success") {
        document.getElementById("arxivTitle").value = json.data.title || "";
        document.getElementById("arxivId").value = json.data.arxiv_id || "";
        document.getElementById("arxivUrl").value = json.data.url || "";
        document.getElementById("arxivTldr").value = json.data.tldr || "";
      } else alert("Step 4 Error: " + json.error);
    } finally {
      setBtnLoading("btnStep4", false, "Fetch Paper");
    }
  }

  async function runAllStepsSequentially() {
    const btn = document.getElementById("runAllBtn");
    btn.disabled = true;
    await runStep1();
    await runStep2();
    await runStep3();
    await runStep4();
    btn.disabled = false;
  }

  async function sendToLanding() {
    const tickers = Array.from(document.querySelectorAll(".ticker-row")).map(row => ({
      symbol: row.querySelector(".ticker-symbol").value.trim(),
      price: row.querySelector(".ticker-price").value.trim(),
      change_percent: row.querySelector(".ticker-change").value.trim(),
    })).filter(t => t.symbol);

    const events = Array.from(document.querySelectorAll(".event-row")).map(row => ({
      name: row.querySelector(".event-name").value.trim(),
      date: row.querySelector(".event-date").value.trim(),
      location: row.querySelector(".event-location").value.trim(),
      url: row.querySelector(".event-url").value.trim(),
    })).filter(e => e.name);

    const payload = {
      tickers,
      events,
      spotlight_repo: {
        repo_name: document.getElementById("repoName").value.trim(),
        stars: document.getElementById("repoStars").value.trim(),
        url: document.getElementById("repoUrl").value.trim(),
        summary: document.getElementById("repoSummary").value.trim(),
      },
      spotlight_arxiv: {
        title: document.getElementById("arxivTitle").value.trim(),
        arxiv_id: document.getElementById("arxivId").value.trim(),
        url: document.getElementById("arxivUrl").value.trim(),
        tldr: document.getElementById("arxivTldr").value.trim(),
      }
    };

    const btn = document.getElementById("publishBtn");
    btn.disabled = true;
    btn.innerText = "Publishing...";
    try {
      const res = await fetch("/api/admin/pulse/publish", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (json.status === "success") {
        document.getElementById("lastPublishedLabel").innerText = json.published_at;
        document.getElementById("statusMessage").innerHTML = `<span class="text-success fw-semibold">✓ Live on landing page (${json.published_at})</span>`;
      } else {
        alert("Publish failed: " + json.error);
      }
    } finally {
      btn.disabled = false;
      btn.innerHTML = "🚀 Send to Landing";
    }
  }

  renderTickers(initialPulse.tickers || []);
  renderEvents(initialPulse.events || []);
</script>
</body>
</html>
